<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>MAGE2 Runtime</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "Segoe UI", system-ui, sans-serif;
        background: #05080b;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
      }

      body {
        overflow: hidden;
        background: #05080b;
      }

      .mage2-runtime-boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        color: #f4f8fb;
        background:
          radial-gradient(circle at 50% 42%, rgba(38, 163, 207, 0.16), transparent 34rem),
          linear-gradient(145deg, #05080b, #0b141b 56%, #071018);
      }

      .mage2-runtime-boot__content {
        width: min(78vw, 52rem);
        text-align: center;
      }

      .mage2-runtime-boot__brand {
        margin: 0;
        color: #79d7f4;
        font-size: clamp(0.72rem, 1.2vw, 0.9rem);
        font-weight: 800;
        letter-spacing: 0.22em;
      }

      .mage2-runtime-boot__track {
        width: min(16rem, 48vw);
        height: 0.18rem;
        margin: 2.4rem auto 0;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
      }

      .mage2-runtime-boot__track::after {
        content: "";
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: #65d8ff;
        animation: mage2-runtime-boot-travel 1.15s ease-in-out infinite alternate;
      }

      @keyframes mage2-runtime-boot-travel {
        from { transform: translateX(-8%); }
        to { transform: translateX(136%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .mage2-runtime-boot__track::after {
          width: 100%;
          animation: none;
          opacity: 0.75;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="mage2-runtime-boot" aria-label="MAGE2 Player">
        <div class="mage2-runtime-boot__content">
          <p class="mage2-runtime-boot__brand">MAGE2 PLAYER</p>
          <div class="mage2-runtime-boot__track" aria-hidden="true"></div>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
